[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

solc_version = '0.8.26'
evm_version = "cancun"
optimizer_runs = 800
via_ir = false
ffi = true
auto_detect_remappings = false
remappings = [
    "@uniswap/v4-core/=lib/v4-hooks-public/lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-hooks-public/lib/v4-periphery/",
    "v4-core/=lib/v4-hooks-public/lib/v4-core/src/",
    "v4-periphery/=lib/v4-hooks-public/lib/v4-periphery/",
    "v4-hooks-public/=lib/v4-hooks-public/",
    "forge-std/=lib/forge-std/src/",
    "solmate/=lib/v4-hooks-public/lib/v4-core/lib/solmate/",
]